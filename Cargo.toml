[workspace]
resolver = "3"
members = [
    "host/deckard-bridge",
    "host/deckard-core",
    "host/deckard-container",
    "host/deckard-fonts-sync",
    "host/deckard-host-tools",
    "host/deckard-ime",
    "host/deckard-launch",
    "host/deckard-mpris",
    "host/deckard-notifications",
    "host/deckard-overlay-sync",
    "host/deckard-packages",
    "host/deckard-runtime",
    "image/deckard-image-tools",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
async-channel = "=2.5.0"
async-executor = "=1.14.0"
async-io = "=2.6.0"
base64 = "=0.23.1"
futures-lite = "=2.6.1"
hex = "=0.4.3"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
nix = { version = "=0.31.3", default-features = false, features = ["user"] }
regex = "=1.13.1"
rustix = { version = "=1.1.5", features = ["fs", "mount", "net", "process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
signal-hook = "=0.3.18"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
unicode-general-category = "=1.1.0"
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
overflow-checks = true
