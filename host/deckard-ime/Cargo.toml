[package]
name = "deckard-ime"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
deckard-core = { path = "../deckard-core" }
serde_json = "=1.0.154"
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
todo = "deny"
unimplemented = "deny"
