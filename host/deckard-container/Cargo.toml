[package]
name = "deckard-container"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
async-io = "2"
blocking = "=1.7.0"
rustix = { version = "=1.1.5", features = ["fs", "process"] }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
